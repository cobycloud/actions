name: Reusable GHCR Publish

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      image:
        description: Fully qualified GHCR image name.
        type: string
        required: true
      visibility:
        description: Expected GHCR visibility; private verifies anonymous denial and authenticated pulls.
        type: string
        required: false
        default: public
      context:
        description: Docker build context.
        type: string
        required: false
        default: .
      dockerfile:
        description: Dockerfile path.
        type: string
        required: false
        default: Dockerfile
      platforms:
        description: Comma-separated target platforms.
        type: string
        required: false
        default: linux/amd64,linux/arm64
      build-args:
        description: Newline-separated Docker build arguments.
        type: string
        required: false
        default: ""
      tag-regex:
        description: Bash regular expression for permitted release tags.
        type: string
        required: false
        default: ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|-[0-9A-Za-z.-]+)?$
      package-api-path:
        description: Optional gh api path used to verify caller access to an existing package.
        type: string
        required: false
        default: ""
      certificate-identity-regexp:
        description: Cosign certificate identity regular expression for the reusable signing workflow.
        type: string
        required: false
        default: ^https://github.com/cobycloud/actions/.github/workflows/reusable-ghcr-publish.yml@refs/heads/master$
    outputs:
      digest:
        description: Published multi-platform image digest.
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate requested visibility
        env:
          VISIBILITY: ${{ inputs.visibility }}
        shell: python
        run: |
          import os
          if os.environ['VISIBILITY'] not in {'public', 'private'}:
              raise SystemExit('visibility must be public or private')

      - name: Validate release tag
        id: release
        shell: bash
        env:
          TAG_REGEX: ${{ inputs.tag-regex }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ $TAG_REGEX ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9][A-Za-z0-9_.-]*$ || ${#version} -gt 128 ]]; then
            echo "Invalid container version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GHCR package Actions access
        if: ${{ inputs.package-api-path != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_API_PATH: ${{ inputs.package-api-path }}
        shell: bash
        run: gh api "$PACKAGE_API_PATH" > /dev/null

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }},priority=1000
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.stable == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          provenance: mode=max
          sbom: true

      - name: Sign immutable GHCR digest
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest immutable GHCR provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Pull the public immutable image without registry credentials
        if: inputs.visibility == 'public'
        env:
          IMAGE: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          docker logout ghcr.io
          docker pull "$IMAGE"

      - name: Verify private package and pull boundaries
        if: inputs.visibility == 'private'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: python
        run: |
          import json, os, subprocess, tempfile
          image = os.environ['IMAGE']
          owner, package = image.removeprefix('ghcr.io/').split('/', 1)
          from urllib.parse import quote
          path = f'/orgs/{owner}/packages/container/{quote(package, safe="")}'
          metadata = json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          if metadata['visibility'] != 'private':
              raise SystemExit('Expected a private GHCR package; refusing to continue')
          reference = image + '@' + os.environ['DIGEST']
          with tempfile.TemporaryDirectory() as directory:
              result = subprocess.run(
                  ['docker', '--config', directory, 'pull', reference],
                  capture_output=True, text=True,
              )
              if result.returncode == 0:
                  raise SystemExit('Private image unexpectedly allowed anonymous pulls')
              if not any(word in (result.stdout + result.stderr).lower()
                         for word in ('unauthorized', 'denied', 'authentication required')):
                  raise SystemExit('Anonymous pull failed without an authentication denial')
          subprocess.run(['docker', 'pull', reference], check=True)

      - name: Verify the keyless image signature
        env:
          IMAGE: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
          CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
        shell: bash
        run: >-
          cosign verify "$IMAGE"
          --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
        shell: bash
        run: >-
          gh attestation verify "oci://$IMAGE"
          --repo "${{ github.repository }}"
          --bundle-from-oci
          --signer-repo cobycloud/actions
