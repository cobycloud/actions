name: Reusable VM104 Wyrmctl Certificate Adoption

on:
  workflow_call:
    inputs:
      desired-state: {type: string, required: true}
      owner: {type: string, required: true}
      certificate-resource-id: {type: string, required: true}
      confirmation: {type: string, required: true}

permissions:
  contents: read

concurrency:
  group: vm104-${{ inputs.owner }}-${{ inputs.certificate-resource-id }}-certificate-adoption
  cancel-in-progress: false

env:
  WYRMCTL_CREDENTIAL: /etc/groupsum/portwyrm.env

jobs:
  adopt:
    runs-on:
      group: portwyrm-deployment
      labels: [self-hosted, Linux, X64, vm104]
    environment: deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5
      - uses: cobycloud/actions/actions/wyrmctl-setup@1f67ac678f115a88f69e5ed8b149a70ab6c374b3
      - name: Validate confirmation and single-certificate scope
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DESIRED_STATE: ${{ inputs.desired-state }}
          OWNER: ${{ inputs.owner }}
          CERTIFICATE_RESOURCE_ID: ${{ inputs.certificate-resource-id }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "ADOPT $CERTIFICATE_RESOURCE_ID"
          mkdir -p deployment-evidence
          wyrmctl --output json validate "$DESIRED_STATE"
          python - "$DESIRED_STATE" "$OWNER" "$CERTIFICATE_RESOURCE_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          import yaml

          desired_path = Path(sys.argv[1])
          expected_owner = sys.argv[2]
          expected_resource_id = sys.argv[3]
          payload = yaml.safe_load(desired_path.read_text(encoding="utf-8"))
          certificates = payload.get("spec", {}).get("certificates", [])
          if len(certificates) != 1:
              raise SystemExit(
                  "certificate adoption requires exactly one desired certificate; "
                  f"found {len(certificates)}"
              )
          certificate = certificates[0]
          metadata = certificate.get("meta", {})
          if metadata.get("owner") != expected_owner:
              raise SystemExit("certificate owner does not match the reviewed owner input")
          if metadata.get("resource_id") != expected_resource_id:
              raise SystemExit(
                  "certificate resource_id does not match the reviewed resource input"
              )
          if metadata.get("managed_by") != "wyrmctl":
              raise SystemExit("certificate must declare meta.managed_by=wyrmctl")
          domains = certificate.get("domain_names", [])
          if not certificate.get("name") or not domains:
              raise SystemExit("certificate requires a name and at least one domain")
          evidence = {
              "desired_state": str(desired_path),
              "owner": expected_owner,
              "resource_id": expected_resource_id,
              "certificate_name": certificate["name"],
              "domain_names": domains,
          }
          Path("deployment-evidence/adoption-scope.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - id: portwyrm
        name: Load protected Portwyrm automation identity
        shell: bash
        run: |
          set -euo pipefail
          test -r "$WYRMCTL_CREDENTIAL"
          base_url="$(sed -n 's/^PORTWYRM_WYRMCTL_BASE_URL=//p' "$WYRMCTL_CREDENTIAL")"
          identity="$(sed -n 's/^PORTWYRM_WYRMCTL_IDENTITY=//p' "$WYRMCTL_CREDENTIAL")"
          secret="$(sed -n 's/^PORTWYRM_WYRMCTL_SECRET_B64=//p' "$WYRMCTL_CREDENTIAL" | base64 -d)"
          test -n "$base_url"
          test "$identity" = jacob@swarmauri.com
          test -n "$secret"
          echo "::add-mask::$secret"
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - name: Adopt only the reviewed certificate metadata
        shell: bash
        env:
          DESIRED_STATE: ${{ inputs.desired-state }}
          OWNER: ${{ inputs.owner }}
          NPM_BASE_URL: ${{ steps.portwyrm.outputs.base-url }}
          NPM_IDENTITY: ${{ steps.portwyrm.outputs.identity }}
          NPM_SECRET: ${{ steps.portwyrm.outputs.secret }}
        run: |
          set -euo pipefail
          wyrmctl --output json adopt "$DESIRED_STATE" \
            --owner "$OWNER" \
            --only certificates \
            --metadata-only \
            --certificate-mode reuse \
            --validate-output \
            | tee deployment-evidence/adoption-result.json
          jq -e '.ok == true' deployment-evidence/adoption-result.json >/dev/null
      - name: Record immutable execution binding
        shell: bash
        env:
          OWNER: ${{ inputs.owner }}
          CERTIFICATE_RESOURCE_ID: ${{ inputs.certificate-resource-id }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg owner "$OWNER" \
            --arg resource_id "$CERTIFICATE_RESOURCE_ID" \
            '{repository: $repository, commit: $commit, run_id: $run_id, owner: $owner, resource_id: $resource_id}' \
            > deployment-evidence/execution-binding.json
          sha256sum deployment-evidence/*.json > deployment-evidence/sha256sums.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm104-certificate-adoption-${{ inputs.owner }}-${{ github.run_id }}
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 30
