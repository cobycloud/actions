name: Reusable Docs Release

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      working-directory:
        type: string
        required: false
        default: "."
      setup-command:
        type: string
        required: false
        default: ""
      build-command:
        type: string
        required: true
      output-path:
        type: string
        required: false
        default: site
      deploy-pages:
        type: boolean
        required: false
        default: true
      upload-release-asset:
        type: boolean
        required: false
        default: false
      tag-name:
        type: string
        required: false
        default: ""
      release-asset-name:
        type: string
        required: false
        default: docs-site

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs-release:
    runs-on: ${{ inputs.runner }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: cobycloud/actions/actions/docs-build@main
        with:
          working-directory: ${{ inputs.working-directory }}
          setup-command: ${{ inputs.setup-command }}
          build-command: ${{ inputs.build-command }}
          output-path: ${{ inputs.output-path }}
          artifact-name: docs-site

      - name: Configure Pages
        if: ${{ inputs.deploy-pages == true }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: ${{ inputs.deploy-pages == true }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output-path }}

      - name: Deploy Pages
        if: ${{ inputs.deploy-pages == true }}
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Archive docs
        if: ${{ inputs.upload-release-asset == true }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ inputs.release-asset-name }}.tar.gz" -C "${{ inputs.working-directory }}/${{ inputs.output-path }}" .

      - name: Upload docs release asset
        if: ${{ inputs.upload-release-asset == true && inputs.tag-name != '' }}
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ inputs.tag-name }}
          files: ${{ inputs.release-asset-name }}.tar.gz
