name: Reusable Build Darwin Artifact

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: macos-latest
      working-directory:
        type: string
        required: false
        default: "."
      setup-command:
        type: string
        required: false
        default: ""
      build-command:
        type: string
        required: true
      macos-build-command:
        type: string
        required: false
        default: ""
      artifact-path:
        type: string
        required: true
      artifact-name:
        type: string
        required: false
        default: darwin-artifact

permissions:
  contents: read

jobs:
  build-darwin-artifact:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cobycloud/actions/actions/platform-artifact-build@main
        with:
          working-directory: ${{ inputs.working-directory }}
          setup-command: ${{ inputs.setup-command }}
          build-command: ${{ inputs.build-command }}
          macos-build-command: ${{ inputs.macos-build-command }}
          artifact-path: ${{ inputs.artifact-path }}
          artifact-name: ${{ inputs.artifact-name }}
