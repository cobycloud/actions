name: Reusable Terraform Apply

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      environment:
        type: string
        required: false
        default: ""
      working-directory:
        type: string
        required: false
        default: "."
      terraform-version:
        type: string
        required: false
        default: latest
      init-command:
        type: string
        required: false
        default: terraform init
      apply-command:
        type: string
        required: false
        default: terraform apply -auto-approve
      plan-artifact-name:
        type: string
        required: false
        default: terraform-plan
      plan-path:
        type: string
        required: false
        default: tfplan
      expected-source-sha:
        type: string
        required: true
      expected-plan-sha256:
        type: string
        required: true
      plan-run-id:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  terraform-apply:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: cobycloud/actions/actions/terraform-apply@main
        with:
          working-directory: ${{ inputs.working-directory }}
          terraform-version: ${{ inputs.terraform-version }}
          init-command: ${{ inputs.init-command }}
          apply-command: ${{ inputs.apply-command }}
          plan-artifact-name: ${{ inputs.plan-artifact-name }}
          plan-path: ${{ inputs.plan-path }}
          expected-source-sha: ${{ inputs.expected-source-sha }}
          expected-plan-sha256: ${{ inputs.expected-plan-sha256 }}
          plan-run-id: ${{ inputs.plan-run-id }}
          github-token: ${{ github.token }}
