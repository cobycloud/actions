name: Reusable Python Package Matrix CI

on:
  workflow_call:
    inputs:
      runners:
        type: string
        required: false
        default: '["ubuntu-latest"]'
      python-versions:
        type: string
        required: false
        default: '["3.10","3.11","3.12","3.13"]'
      package-cells:
        type: string
        required: false
        default: '[{"name":"package","path":"."}]'
      install-command:
        type: string
        required: false
        default: uv sync --all-groups --frozen
      compile-command:
        type: string
        required: false
        default: uv run python -m compileall .
      test-command:
        type: string
        required: false
        default: uv run pytest
      docs-command:
        type: string
        required: false
        default: ""
      build-command:
        type: string
        required: false
        default: ""
      compute-monorepo-pythonpath:
        type: boolean
        required: false
        default: false
      artifact-path:
        type: string
        required: false
        default: ""
      artifact-name-prefix:
        type: string
        required: false
        default: python-package-ci
      fail-fast:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  python-package-matrix:
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}
        package_cell: ${{ fromJSON(inputs.package-cells) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: cobycloud/actions/actions/python-package-ci@main
        with:
          python-version: ${{ matrix.python-version }}
          package-path: ${{ matrix.package_cell.path }}
          install-command: ${{ inputs.install-command }}
          compile-command: ${{ inputs.compile-command }}
          test-command: ${{ inputs.test-command }}
          docs-command: ${{ inputs.docs-command }}
          build-command: ${{ inputs.build-command }}
          compute-monorepo-pythonpath: ${{ inputs.compute-monorepo-pythonpath }}
          artifact-path: ${{ inputs.artifact-path }}
          artifact-name: ${{ inputs.artifact-name-prefix }}-${{ matrix.package_cell.name }}-py-${{ matrix.python-version }}-${{ matrix.runner }}
