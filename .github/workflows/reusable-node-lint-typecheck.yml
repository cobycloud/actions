name: Reusable Node Lint Typecheck

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      node-version:
        type: string
        required: false
        default: "20"
      working-directory:
        type: string
        required: false
        default: "."
      install-command:
        type: string
        required: false
        default: npm ci
      lint-command:
        type: string
        required: false
        default: npm run lint --if-present
      typecheck-command:
        type: string
        required: false
        default: npm run typecheck --if-present
      test-command:
        type: string
        required: false
        default: npm test --if-present
      build-command:
        type: string
        required: false
        default: npm run build --if-present

permissions:
  contents: read

jobs:
  node-lint-typecheck:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: cobycloud/actions/actions/node-lint-typecheck@main
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          install-command: ${{ inputs.install-command }}
          lint-command: ${{ inputs.lint-command }}
          typecheck-command: ${{ inputs.typecheck-command }}
          test-command: ${{ inputs.test-command }}
          build-command: ${{ inputs.build-command }}
