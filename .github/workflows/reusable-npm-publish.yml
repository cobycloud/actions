name: Reusable npm Publish

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      publish-mode:
        type: string
        required: false
        default: auto
      node-version:
        type: string
        required: false
        default: "25"
      package-directory:
        type: string
        required: false
        default: "."
      registry-url:
        type: string
        required: false
        default: https://registry.npmjs.org
      scope:
        type: string
        required: false
        default: ""
      install-command:
        type: string
        required: false
        default: npm ci
      build-command:
        type: string
        required: false
        default: ""
      test-command:
        type: string
        required: false
        default: ""
      tag:
        type: string
        required: false
        default: latest
      access:
        type: string
        required: false
        default: public
      provenance:
        type: boolean
        required: false
        default: true
      dry-run:
        type: boolean
        required: false
        default: false
    secrets:
      NPM_API_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cobycloud/actions/actions/npm-publish@main
        with:
          publish-mode: ${{ inputs.publish-mode }}
          node-version: ${{ inputs.node-version }}
          package-directory: ${{ inputs.package-directory }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}
          npm-api-token: ${{ secrets.NPM_API_TOKEN }}
          install-command: ${{ inputs.install-command }}
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          tag: ${{ inputs.tag }}
          access: ${{ inputs.access }}
          provenance: ${{ inputs.provenance }}
          dry-run: ${{ inputs.dry-run }}
