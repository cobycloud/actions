name: Reusable Python uv CI

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      python-version:
        type: string
        required: false
        default: "3.12"
      working-directory:
        type: string
        required: false
        default: "."
      install-command:
        type: string
        required: false
        default: uv sync --all-groups --frozen
      run-command:
        type: string
        required: false
        default: uv run pytest
      compute-monorepo-pythonpath:
        type: boolean
        required: false
        default: false
      artifact-path:
        type: string
        required: false
        default: ""
      artifact-name:
        type: string
        required: false
        default: python-artifact

permissions:
  contents: read

jobs:
  python-uv-ci:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: cobycloud/actions/actions/python-uv@main
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
          install-command: ${{ inputs.install-command }}
          run-command: ${{ inputs.run-command }}
          compute-monorepo-pythonpath: ${{ inputs.compute-monorepo-pythonpath }}

      - name: Upload artifact
        if: ${{ inputs.artifact-path != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
