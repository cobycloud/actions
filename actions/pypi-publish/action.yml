name: PyPI Publish
description: Publish Python distributions to PyPI or TestPyPI using trusted publishing or token fallback.
inputs:
  packages-dir:
    description: Directory or glob containing distribution files.
    required: false
    default: dist
  repository-url:
    description: Optional repository URL, such as https://test.pypi.org/legacy/.
    required: false
    default: ""
  password:
    description: Optional PyPI API token. Leave empty for trusted publishing.
    required: false
    default: ""
  skip-existing:
    description: Do not fail when a file already exists.
    required: false
    default: "false"
  verbose:
    description: Enable verbose upload output.
    required: false
    default: "false"
  print-hash:
    description: Print hashes for uploaded distributions.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Publish distributions
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ inputs.password }}
      run: |
        set -euo pipefail
        args=(upload "${{ inputs.packages-dir }}"/*)
        if [[ -n "${{ inputs.repository-url }}" ]]; then
          args+=(--repository-url "${{ inputs.repository-url }}")
        fi
        if [[ "${{ inputs.skip-existing }}" == "true" ]]; then
          args+=(--skip-existing)
        fi
        if [[ "${{ inputs.verbose }}" == "true" ]]; then
          args+=(--verbose)
        fi
        if command -v uvx >/dev/null 2>&1; then
          uvx twine "${args[@]}"
        else
          python3 -m pip install --user twine
          python3 -m twine "${args[@]}"
        fi
