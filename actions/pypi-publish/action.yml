name: PyPI Publish
description: Publish Python distributions to PyPI or TestPyPI using trusted publishing or token fallback.
inputs:
  packages-dir:
    description: Directory or glob containing distribution files.
    required: false
    default: dist
  repository-url:
    description: Optional repository URL, such as https://test.pypi.org/legacy/.
    required: false
    default: ""
  password:
    description: Optional PyPI API token. Leave empty for trusted publishing.
    required: false
    default: ""
  skip-existing:
    description: Do not fail when a file already exists.
    required: false
    default: "false"
  verbose:
    description: Enable verbose upload output.
    required: false
    default: "false"
  print-hash:
    description: Print hashes for uploaded distributions.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Publish distributions
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ inputs.password }}
      run: |
        set -euo pipefail
        if [[ -z "${TWINE_PASSWORD}" ]]; then
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "Trusted Publishing requires id-token: write permissions." >&2
            exit 1
          fi
          audience="pypi"
          if [[ "${{ inputs.repository-url }}" == *"test.pypi.org"* ]]; then
            audience="testpypi"
          fi
          oidc_resp="$(curl --fail-with-body -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")"
          oidc_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "${oidc_resp}")"
          mint_url="https://pypi.org/_/oidc/mint-token"
          if [[ "${{ inputs.repository-url }}" == *"test.pypi.org"* ]]; then
            mint_url="https://test.pypi.org/_/oidc/mint-token"
          fi
          mint_resp="$(python3 -c 'import json,sys; print(json.dumps({"token": sys.argv[1]}))' "${oidc_token}" \
            | curl --fail-with-body -sS -X POST "${mint_url}" \
                -H "Content-Type: application/json" \
                --data-binary @-)"
          TWINE_PASSWORD="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "${mint_resp}")"
          echo "::add-mask::${TWINE_PASSWORD}"
          export TWINE_PASSWORD
        fi
        python3 -m pip install --user --upgrade uv
        export PATH="${HOME}/.local/bin:${PATH}"
        args=(publish --username "${TWINE_USERNAME}" --password "${TWINE_PASSWORD}")
        if [[ -n "${{ inputs.repository-url }}" ]]; then
          args+=(--publish-url "${{ inputs.repository-url }}")
        fi
        if [[ "${{ inputs.skip-existing }}" == "true" ]]; then
          if [[ "${{ inputs.repository-url }}" == *"test.pypi.org"* ]]; then
            args+=(--check-url "https://test.pypi.org/simple/")
          else
            args+=(--check-url "https://pypi.org/simple/")
          fi
        fi
        args+=("${{ inputs.packages-dir }}"/*)
        uv "${args[@]}"
