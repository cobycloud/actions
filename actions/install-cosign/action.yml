name: Install pinned Cosign
description: Install the checksum-verified official Cosign release on Linux.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            asset=cosign-linux-amd64
            asset_id=264862470
            checksum=bcfeae05557a9f313ee4392d2f335d0ff69ebbfd232019e3736fb04999fe1734
            ;;
          Linux/ARM64)
            asset=cosign-linux-arm64
            asset_id=264862495
            checksum=2cbcea1873ad76274c3f241ef175d204654e3aac3e73e6ec4504e5227015cb0a
            ;;
          *) echo "Unsupported Cosign runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        directory="$(mktemp -d "$RUNNER_TEMP/cosign.XXXXXXXX")"
        release=https://github.com/sigstore/cosign/releases/download/v2.5.2
        asset_api="https://api.github.com/repos/sigstore/cosign/releases/assets/$asset_id"
        # Request fresh redirects to avoid stale cached release-asset URLs.
        download() {
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
            --retry-max-time 120 --max-time 90 "$@" --output "$directory/cosign" &&
            printf '%s  %s\n' "$checksum" "$directory/cosign" | sha256sum -c -
        }
        if ! download -H 'Accept: application/octet-stream' "$asset_api?run=${directory##*/}"; then
          download "$release/$asset?run=${directory##*/}"
        fi
        chmod 0755 "$directory/cosign"
        echo "$directory" >> "$GITHUB_PATH"
