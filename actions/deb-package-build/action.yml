name: Debian Package Build
description: Build Debian packages and upload .deb outputs.
inputs:
  working-directory:
    description: Directory containing Debian package metadata or packaging scripts.
    required: false
    default: "."
  setup-command:
    description: Optional command to install packaging dependencies.
    required: false
    default: ""
  build-command:
    description: Command that builds Debian packages.
    required: false
    default: dpkg-buildpackage -us -uc -b
  artifact-path:
    description: Debian package path or glob to upload.
    required: false
    default: "../*.deb"
  artifact-name:
    description: Uploaded artifact name.
    required: false
    default: debian-packages
  retention-days:
    description: Artifact retention days.
    required: false
    default: "30"
runs:
  using: composite
  steps:
    - name: Setup Debian packaging
      if: ${{ inputs.setup-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.setup-command }}

    - name: Build Debian package
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: Upload Debian packages
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
