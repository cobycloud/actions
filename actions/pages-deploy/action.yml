name: Pages Deploy
description: Upload and deploy a GitHub Pages artifact.
inputs:
  path:
    description: Static site path to upload.
    required: false
    default: site
  artifact-name:
    description: Pages artifact name.
    required: false
    default: github-pages
runs:
  using: composite
  steps:
    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.path }}
        name: ${{ inputs.artifact-name }}

    - name: Deploy Pages
      uses: actions/deploy-pages@v4
      with:
        artifact_name: ${{ inputs.artifact-name }}
