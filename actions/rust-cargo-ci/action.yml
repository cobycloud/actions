name: Rust Cargo CI
description: Set up Rust and run cargo fmt, clippy, test, build, and optional docs commands.
inputs:
  rust-toolchain:
    description: Rust toolchain to install.
    required: false
    default: stable
  working-directory:
    description: Directory containing Cargo.toml.
    required: false
    default: "."
  components:
    description: Comma-separated Rust components to install.
    required: false
    default: rustfmt,clippy
  targets:
    description: Comma-separated Rust targets to install.
    required: false
    default: ""
  cache:
    description: Enable Rust dependency cache.
    required: false
    default: "true"
  fmt-command:
    description: Format check command. Leave empty to skip.
    required: false
    default: cargo fmt --all -- --check
  clippy-command:
    description: Clippy command. Leave empty to skip.
    required: false
    default: cargo clippy --all-targets --all-features -- -D warnings
  test-command:
    description: Test command. Leave empty to skip.
    required: false
    default: cargo test --all-features
  build-command:
    description: Build command. Leave empty to skip.
    required: false
    default: cargo build --all-features
  doc-command:
    description: Documentation command. Leave empty to skip.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache Cargo
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.working-directory }}

    - name: Format
      if: ${{ inputs.fmt-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.fmt-command }}

    - name: Clippy
      if: ${{ inputs.clippy-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.clippy-command }}

    - name: Test
      if: ${{ inputs.test-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.test-command }}

    - name: Build
      if: ${{ inputs.build-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: Docs
      if: ${{ inputs.doc-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.doc-command }}
