name: GitHub Release
description: Create or update a GitHub Release and upload files.
inputs:
  tag-name:
    description: Release tag name.
    required: true
  name:
    description: Release display name. Defaults to tag when empty.
    required: false
    default: ""
  body:
    description: Inline release body.
    required: false
    default: ""
  body-path:
    description: Path to release notes file.
    required: false
    default: ""
  files:
    description: Newline-delimited globs of files to upload.
    required: false
    default: ""
  draft:
    description: Create or keep release as draft.
    required: false
    default: "false"
  prerelease:
    description: Mark release as prerelease.
    required: false
    default: "false"
  make-latest:
    description: "Latest release handling: true, false, or legacy."
    required: false
    default: legacy
  fail-on-unmatched-files:
    description: Fail if a file glob does not match.
    required: false
    default: "true"
  token:
    description: GitHub token.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Publish GitHub Release with explicit token
      if: ${{ inputs.token != '' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag-name }}
        name: ${{ inputs.name }}
        body: ${{ inputs.body }}
        body_path: ${{ inputs.body-path }}
        files: ${{ inputs.files }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        make_latest: ${{ inputs.make-latest }}
        fail_on_unmatched_files: ${{ inputs.fail-on-unmatched-files }}
        token: ${{ inputs.token }}

    - name: Publish GitHub Release with default token
      if: ${{ inputs.token == '' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag-name }}
        name: ${{ inputs.name }}
        body: ${{ inputs.body }}
        body_path: ${{ inputs.body-path }}
        files: ${{ inputs.files }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        make_latest: ${{ inputs.make-latest }}
        fail_on_unmatched_files: ${{ inputs.fail-on-unmatched-files }}
