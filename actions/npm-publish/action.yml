name: npm Publish
description: Publish a Node package to npmjs or another npm-compatible registry.
inputs:
  publish-mode:
    description: "Publish mode: token requires npm-api-token, trusted uses npm trusted publishing, auto uses npm-api-token when present and otherwise uses trusted publishing."
    required: false
    default: auto
  node-version:
    description: Node.js version to install.
    required: false
    default: "25"
  package-directory:
    description: Directory containing package.json.
    required: false
    default: "."
  install-directory:
    description: Directory where install, build, and test commands run. Defaults to package-directory.
    required: false
    default: ""
  cache-dependency-path:
    description: Dependency file path for setup-node cache. Defaults to <install-directory or package-directory>/package-lock.json.
    required: false
    default: ""
  registry-url:
    description: npm registry URL.
    required: false
    default: https://registry.npmjs.org
  scope:
    description: Optional package scope for actions/setup-node registry configuration.
    required: false
    default: ""
  npm-api-token:
    description: Optional npm automation token. Required when publish-mode is token. Leave empty for trusted publishing in auto mode.
    required: false
    default: ""
  install-command:
    description: Optional install command. Leave empty to skip install.
    required: false
    default: npm ci
  build-command:
    description: Optional build command. Leave empty to skip build.
    required: false
    default: ""
  test-command:
    description: Optional test command. Leave empty to skip tests.
    required: false
    default: ""
  tag:
    description: npm dist-tag.
    required: false
    default: latest
  access:
    description: npm access level, such as public or restricted. Leave empty to omit.
    required: false
    default: public
  provenance:
    description: Publish with npm provenance.
    required: false
    default: "true"
  skip-existing:
    description: Check npm before publishing and warn instead of failing when the package version already exists.
    required: false
    default: "false"
  dry-run:
    description: Run npm publish with --dry-run.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Resolve npm publish paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        install_dir="${{ inputs.install-directory }}"
        if [[ -z "$install_dir" ]]; then
          install_dir="${{ inputs.package-directory }}"
        fi
        cache_path="${{ inputs.cache-dependency-path }}"
        if [[ -z "$cache_path" ]]; then
          cache_path="$install_dir/package-lock.json"
        fi
        registry_url="${{ inputs.registry-url }}"
        if [[ "${{ inputs.publish-mode }}" == "trusted" ]] || [[ "${{ inputs.publish-mode }}" == "auto" && -z "${{ inputs.npm-api-token }}" ]]; then
          registry_url=""
        fi
        {
          echo "install-directory=$install_dir"
          echo "cache-dependency-path=$cache_path"
          echo "registry-url=$registry_url"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Node with registry auth
      if: ${{ steps.paths.outputs.registry-url != '' }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ steps.paths.outputs.registry-url }}
        scope: ${{ inputs.scope }}
        cache: npm
        cache-dependency-path: ${{ steps.paths.outputs.cache-dependency-path }}

    - name: Setup Node
      if: ${{ steps.paths.outputs.registry-url == '' }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ steps.paths.outputs.cache-dependency-path }}

    - name: Install dependencies
      if: ${{ inputs.install-command != '' }}
      shell: bash
      working-directory: ${{ steps.paths.outputs.install-directory }}
      run: ${{ inputs.install-command }}

    - name: Build
      if: ${{ inputs.build-command != '' }}
      shell: bash
      working-directory: ${{ steps.paths.outputs.install-directory }}
      run: ${{ inputs.build-command }}

    - name: Test
      if: ${{ inputs.test-command != '' }}
      shell: bash
      working-directory: ${{ steps.paths.outputs.install-directory }}
      run: ${{ inputs.test-command }}

    - name: Publish package
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      env:
        NPM_API_TOKEN: ${{ inputs.npm-api-token }}
      run: |
        set -euo pipefail
        mode="${{ inputs.publish-mode }}"
        case "${mode}" in
          auto|token|trusted) ;;
          *)
            echo "publish-mode must be one of: auto, token, trusted." >&2
            exit 1
            ;;
        esac
        publish_token="${NPM_API_TOKEN}"
        if [[ "${{ inputs.skip-existing }}" == "true" && "${{ inputs.dry-run }}" != "true" ]]; then
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "::warning title=npm package already published::${package_name}@${package_version} already exists; skipping publish."
            exit 0
          fi
        fi
        if [[ "${mode}" == "token" && -z "${publish_token}" ]]; then
          echo "NPM_API_TOKEN is required when publish-mode is token." >&2
          exit 1
        fi
        if [[ "${mode}" == "trusted" ]]; then
          publish_token=""
        fi
        if [[ -n "${publish_token}" ]]; then
          echo "::add-mask::${publish_token}"
          export NODE_AUTH_TOKEN="${publish_token}"
          export NPM_TOKEN="${publish_token}"
        else
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG NPM_CONFIG_ALWAYS_AUTH
        fi
        args=(--tag "${{ inputs.tag }}")
        if [[ -n "${{ inputs.access }}" ]]; then
          args+=(--access "${{ inputs.access }}")
        fi
        if [[ "${{ inputs.provenance }}" == "true" ]]; then
          args+=(--provenance)
        fi
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          args+=(--dry-run)
        fi
        npm publish "${args[@]}"
