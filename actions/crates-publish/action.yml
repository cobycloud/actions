name: crates.io Publish
description: Publish a Rust crate with cargo publish.
inputs:
  publish-mode:
    description: "Publish mode: token requires crates-api-token, trusted uses crates.io Trusted Publishing, auto uses crates-api-token when present and otherwise uses Trusted Publishing."
    required: false
    default: token
  rust-toolchain:
    description: Rust toolchain to install.
    required: false
    default: stable
  working-directory:
    description: Directory containing Cargo.toml.
    required: false
    default: "."
  crates-api-token:
    description: Optional crates.io or registry token. Required when publishing to crates.io.
    required: false
    default: ""
  registry:
    description: Optional Cargo registry name. Leave empty for crates.io.
    required: false
    default: ""
  package:
    description: Optional package name for workspaces.
    required: false
    default: ""
  features:
    description: Optional feature flags.
    required: false
    default: ""
  all-features:
    description: Publish with --all-features.
    required: false
    default: "false"
  no-default-features:
    description: Publish with --no-default-features.
    required: false
    default: "false"
  dry-run:
    description: Run cargo publish with --dry-run.
    required: false
    default: "false"
  allow-dirty:
    description: Run cargo publish with --allow-dirty.
    required: false
    default: "false"
  no-verify:
    description: Run cargo publish with --no-verify.
    required: false
    default: "false"
  skip-existing:
    description: Check crates.io before publishing and warn instead of failing when the crate version already exists.
    required: false
    default: "false"
  max-attempts:
    description: Maximum publish attempts when crates.io rate limits a new crate.
    required: false
    default: "6"
  retry-delay-seconds:
    description: Delay between rate-limit retry attempts.
    required: false
    default: "600"
runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Publish crate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CRATES_API_TOKEN: ${{ inputs.crates-api-token }}
      run: |
        set -euo pipefail
        mode="${{ inputs.publish-mode }}"
        case "${mode}" in
          auto|token|trusted) ;;
          *)
            echo "publish-mode must be one of: auto, token, trusted." >&2
            exit 1
            ;;
        esac
        publish_token="${CRATES_API_TOKEN}"
        if [[ "${{ inputs.skip-existing }}" == "true" && "${{ inputs.dry-run }}" != "true" && -z "${{ inputs.registry }}" ]]; then
          metadata="$(cargo metadata --no-deps --format-version 1)"
          crate_name="$(python3 -c 'import json,sys; data=json.load(sys.stdin); package="${{ inputs.package }}"; matches=[p for p in data["packages"] if not package or p["name"] == package]; print(matches[0]["name"])' <<< "${metadata}")"
          crate_version="$(python3 -c 'import json,sys; data=json.load(sys.stdin); package="${{ inputs.package }}"; matches=[p for p in data["packages"] if not package or p["name"] == package]; print(matches[0]["version"])' <<< "${metadata}")"
          status="$(curl -sS -o /dev/null -w "%{http_code}" -H "User-Agent: cobycloud-actions-crates-publish/1.0" "https://crates.io/api/v1/crates/${crate_name}/${crate_version}")"
          if [[ "${status}" == "200" ]]; then
            echo "::warning title=crate version already published::${crate_name}@${crate_version} already exists on crates.io; skipping publish."
            exit 0
          fi
          if [[ "${status}" != "404" ]]; then
            echo "::warning title=crate existence check inconclusive::Failed to check crates.io for ${crate_name}@${crate_version}; HTTP ${status}. Continuing to cargo publish; existing-version errors will still be treated as published."
          fi
        fi
        if [[ "${mode}" == "trusted" ]] || [[ "${mode}" == "auto" && -z "${publish_token}" ]]; then
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub OIDC token request variables are unavailable; grant id-token: write or use crates-api-token." >&2
            exit 1
          fi
          oidc_response="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io")"
          oidc_jwt="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "${oidc_response}")"
          exchange_body="$(python3 -c 'import json,sys; print(json.dumps({"jwt": sys.stdin.read().strip()}))' <<< "${oidc_jwt}")"
          exchange_tmp="$(mktemp)"
          exchange_status="$(curl -sS -o "${exchange_tmp}" -w "%{http_code}" -X POST -H "Content-Type: application/json" -H "Accept: application/json" -d "${exchange_body}" "https://crates.io/api/v1/trusted_publishing/tokens")"
          exchange_response="$(cat "${exchange_tmp}")"
          if [[ "${exchange_status}" != "200" ]]; then
            echo "crates.io trusted publishing token exchange failed with HTTP ${exchange_status}." >&2
            python3 -c 'import json,sys; data=sys.stdin.read(); print(data if data else "<empty response>")' <<< "${exchange_response}" >&2
            exit 1
          fi
          publish_token="$(python3 -c 'import json,sys; data=json.load(sys.stdin); token=data.get("token"); assert token, data; print(token)' <<< "${exchange_response}")"
        fi
        if [[ -z "${publish_token}" ]]; then
          echo "CRATES_API_TOKEN is required when publish-mode is token." >&2
          exit 1
        fi
        echo "::add-mask::${publish_token}"
        export CARGO_REGISTRY_TOKEN="${publish_token}"
        args=()
        if [[ -n "${{ inputs.registry }}" ]]; then
          args+=(--registry "${{ inputs.registry }}")
        fi
        if [[ -n "${{ inputs.package }}" ]]; then
          args+=(-p "${{ inputs.package }}")
        fi
        if [[ -n "${{ inputs.features }}" ]]; then
          args+=(--features "${{ inputs.features }}")
        fi
        if [[ "${{ inputs.all-features }}" == "true" ]]; then
          args+=(--all-features)
        fi
        if [[ "${{ inputs.no-default-features }}" == "true" ]]; then
          args+=(--no-default-features)
        fi
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          args+=(--dry-run)
        fi
        if [[ "${{ inputs.allow-dirty }}" == "true" ]]; then
          args+=(--allow-dirty)
        fi
        if [[ "${{ inputs.no-verify }}" == "true" ]]; then
          args+=(--no-verify)
        fi
        max_attempts="${{ inputs.max-attempts }}"
        retry_delay="${{ inputs.retry-delay-seconds }}"
        attempt=1
        while (( attempt <= max_attempts )); do
          log="$(mktemp)"
          if cargo publish "${args[@]}" 2>&1 | tee "$log"; then
            exit 0
          fi
          status="${PIPESTATUS[0]}"
          if grep -qi "already exists" "$log"; then
            echo "::warning title=crate version already published::crate version already exists; treating as published."
            exit 0
          fi
          if grep -qi "Too Many Requests" "$log" && (( attempt < max_attempts )); then
            echo "crates.io rate limit hit; retrying in ${retry_delay}s"
            sleep "$retry_delay"
            attempt=$((attempt + 1))
            continue
          fi
          exit "$status"
        done
