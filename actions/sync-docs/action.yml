name: Sync Docs
description: Run a docs sync command and open a pull request for changed docs.
inputs:
  working-directory:
    description: Directory where sync command executes.
    required: false
    default: "."
  sync-command:
    description: Command that syncs generated/versioned docs.
    required: true
  paths:
    description: Newline-delimited paths to include in the PR.
    required: false
    default: docs
  commit-message:
    description: Commit message.
    required: false
    default: Sync docs
  branch:
    description: Pull request branch.
    required: false
    default: sync-docs
  title:
    description: Pull request title.
    required: false
    default: Sync docs
  body:
    description: Pull request body.
    required: false
    default: Automated docs sync.
  token:
    description: GitHub token.
    required: true
runs:
  using: composite
  steps:
    - name: Sync docs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.sync-command }}

    - name: Create docs pull request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ inputs.token }}
        add-paths: ${{ inputs.paths }}
        commit-message: ${{ inputs.commit-message }}
        branch: ${{ inputs.branch }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
