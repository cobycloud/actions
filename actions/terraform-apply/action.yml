name: Terraform Apply
description: Verify and apply an immutable Terraform plan artifact.
inputs:
  working-directory:
    description: Directory containing Terraform configuration.
    required: false
    default: "."
  terraform-version:
    description: Terraform version passed to setup-terraform.
    required: false
    default: latest
  init-command:
    description: Terraform init command.
    required: false
    default: terraform init
  apply-command:
    description: Terraform apply command.
    required: false
    default: terraform apply -auto-approve tfplan
  plan-artifact-name:
    description: Reviewed plan artifact name to download before apply.
    required: false
    default: terraform-plan
  plan-path:
    description: Downloaded binary plan path.
    required: false
    default: tfplan
  expected-source-sha:
    description: Required Git commit SHA that created the plan.
    required: true
  expected-plan-sha256:
    description: Required SHA-256 digest emitted by terraform-plan.
    required: true
  plan-run-id:
    description: Workflow run ID that produced the reviewed plan artifact.
    required: false
    default: ""
  github-token:
    description: GitHub token with actions:read when downloading from another run.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Download Terraform plan
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.plan-artifact-name }}
        path: ${{ inputs.working-directory }}
        run-id: ${{ inputs.plan-run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Verify plan provenance
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN_PATH: ${{ inputs.plan-path }}
        EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
        EXPECTED_PLAN_SHA256: ${{ inputs.expected-plan-sha256 }}
      run: |
        set -euo pipefail
        test -n "$EXPECTED_SOURCE_SHA"
        test -n "$EXPECTED_PLAN_SHA256"
        test -f "$PLAN_PATH"
        test -f "${PLAN_PATH}.metadata.json"
        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
        test "$(jq -r .source_sha "${PLAN_PATH}.metadata.json")" = "$EXPECTED_SOURCE_SHA"
        test "$(jq -r .plan_sha256 "${PLAN_PATH}.metadata.json")" = "$EXPECTED_PLAN_SHA256"
        echo "$EXPECTED_PLAN_SHA256  $PLAN_PATH" | sha256sum --check --strict

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.init-command }}

    - name: Terraform apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.apply-command }}
