name: PyPI Token Publish
description: Publish Python distributions to PyPI or TestPyPI using only a PyPI API token and uv publish.
inputs:
  packages-dir:
    description: Directory containing distribution files.
    required: false
    default: dist
  repository-url:
    description: Optional repository URL, such as https://test.pypi.org/legacy/.
    required: false
    default: ""
  api-token:
    description: PyPI API token.
    required: true
  skip-existing:
    description: Do not fail when a file already exists.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Publish distributions with PyPI API token
      shell: bash
      env:
        PYPI_API_TOKEN: ${{ inputs.api-token }}
      run: |
        set -euo pipefail
        dist_args=("${{ inputs.packages-dir }}"/*)
        if [[ "${{ inputs.skip-existing }}" == "true" ]]; then
          pending_file="${RUNNER_TEMP:-/tmp}/pypi-pending-${GITHUB_RUN_ID:-local}-${GITHUB_ACTION:-action}.txt"
          python3 "${GITHUB_ACTION_PATH}/../_lib/pypi_preflight.py" \
            --packages-dir "${{ inputs.packages-dir }}" \
            --repository-url "${{ inputs.repository-url }}" \
            --output "${pending_file}"
          mapfile -t dist_args < "${pending_file}"
          if [[ "${#dist_args[@]}" -eq 0 ]]; then
            echo "::warning title=PyPI publish skipped::All distributions in ${{ inputs.packages-dir }} already exist; skipping publish."
            exit 0
          fi
        fi
        if [[ -z "${PYPI_API_TOKEN}" ]]; then
          echo "PYPI_API_TOKEN is required for pypi-token-publish." >&2
          exit 1
        fi
        echo "::add-mask::${PYPI_API_TOKEN}"
        python3 -m pip install --user --upgrade uv
        export PATH="${HOME}/.local/bin:${PATH}"
        args=(publish --username "__token__" --password "${PYPI_API_TOKEN}")
        if [[ -n "${{ inputs.repository-url }}" ]]; then
          args+=(--publish-url "${{ inputs.repository-url }}")
        fi
        if [[ "${{ inputs.skip-existing }}" == "true" ]]; then
          if [[ "${{ inputs.repository-url }}" == *"test.pypi.org"* ]]; then
            args+=(--check-url "https://test.pypi.org/simple/")
          else
            args+=(--check-url "https://pypi.org/simple/")
          fi
        fi
        args+=("${dist_args[@]}")
        uv "${args[@]}"
