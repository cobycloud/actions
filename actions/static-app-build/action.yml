name: Static App Build
description: Build a static app and upload the generated output.
inputs:
  working-directory:
    description: Static app project directory.
    required: false
    default: "."
  setup-command:
    description: Optional setup command.
    required: false
    default: ""
  build-command:
    description: Static app build command.
    required: true
  output-path:
    description: Built static app output path.
    required: false
    default: dist
  artifact-name:
    description: Uploaded artifact name.
    required: false
    default: static-app
runs:
  using: composite
  steps:
    - name: Setup static app
      if: ${{ inputs.setup-command != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.setup-command }}

    - name: Build static app
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: Upload static app artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.output-path }}
        if-no-files-found: error
